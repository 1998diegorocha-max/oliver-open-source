name: Component, demo or documentation problem
description: Report a reproducible issue with the public component or material.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or vulnerability details. See SECURITY.md for sensitive concerns."
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Include the public file, link or revision involved.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result
      description: Explain how another contributor can reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and test output
      description: Include Node version, operating system, public revision and relevant output without private data.
